[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "osint-investigator"
version = "0.2.0"
description = "A modern, modular OSINT CLI for private investigators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshua Sanchez", email = "phlylow@pm.me" }]
keywords = ["osint", "investigation", "cli", "holehe", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Runtime dependencies. Pinned to known-working minimums.
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "playwright>=1.44.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "holehe>=1.61",
    "tenacity>=8.2.3",
    "dnspython>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
# Single console entry point. After `pip install -e .` you can run `osint-investigator ...`.
osint-investigator = "osint_investigator.cli:app"

[project.urls]
Homepage = "https://github.com/J4y35/osint-investigator"
Issues = "https://github.com/J4y35/osint-investigator/issues"
Repository = "https://github.com/J4y35/osint-investigator"

# ---------- Hatch ----------
[tool.hatch.build.targets.wheel]
packages = ["src/osint_investigator"]
# `src/osint_investigator/data/data.json` is picked up automatically because
# it sits inside the package source tree — keep it there so it ships in the
# wheel and is reachable via `importlib.resources.files("osint_investigator.data")`.

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "TCH"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]

# ---------- pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
