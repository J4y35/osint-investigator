[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "osint-investigator"
version = "0.5.2"
description = "A modern, modular OSINT CLI for private investigators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshua Sanchez", email = "phlylow@pm.me" }]
keywords = ["osint", "investigation", "cli", "holehe", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Runtime dependencies. Pinned to known-working minimums.
dependencies = [
    "typer>=0.20.0",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "playwright>=1.55.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "holehe>=1.61",
    "tenacity>=9.0.0",
    "dnspython>=2.6.1",
]

[project.optional-dependencies]
# Dev-only tooling. Unlike the runtime dependencies above, these carry upper
# bounds. A new major — or, for a 0.x tool like ruff, a new minor — routinely
# adds lint rules or tightens type checking, which turns a clean CI run red
# with no commit to blame it on. Caps make absorbing that a deliberate bump
# instead of a surprise. Upper bounds are safe here in a way they would not be
# on runtime deps: an extra named `dev` is never resolved transitively by
# anyone installing this package, so it cannot cause conflicts downstream.
#
# Floors are the versions actually exercised in CI, not historical minimums.
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.12.0,<0.17",
    "mypy>=2.3,<3",
    # Stub package, date-versioned — no meaningful major to pin against.
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
# Single console entry point. After `pip install -e .` you can run `osint-investigator ...`.
osint-investigator = "osint_investigator.cli:app"

[project.urls]
Homepage = "https://github.com/J4y35/osint-investigator"
Issues = "https://github.com/J4y35/osint-investigator/issues"
Repository = "https://github.com/J4y35/osint-investigator"

# ---------- Hatch ----------
[tool.hatch.build.targets.wheel]
packages = ["src/osint_investigator"]
# `src/osint_investigator/data/data.json` is picked up automatically because
# it sits inside the package source tree — keep it there so it ships in the
# wheel and is reachable via `importlib.resources.files("osint_investigator.data")`.

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "TCH"]
ignore = [
    "E501",  # line length — handled by formatter
    # Typer reads parameter annotations at runtime via typing.get_type_hints,
    # so stdlib types used in CLI option annotations (Path, etc.) MUST stay
    # at module top level. TC003 wants to move them under TYPE_CHECKING,
    # which would break the CLI.
    "TC003",
]

[tool.ruff.format]
quote-style = "double"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]

# ---------- pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ---------- coverage ----------
[tool.coverage.run]
source = ["src/osint_investigator"]
branch = true

[tool.coverage.report]
# Don't fail under a high threshold while large swaths of the codebase are
# network-orchestration paths that aren't exercised in offline CI. We
# track regression of the *fraction* manually until/unless we add a
# network-mocking layer.
fail_under = 50
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
]
